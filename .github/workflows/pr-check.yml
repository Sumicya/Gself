# PR 校验工作流：只跑测试、编译与 R8 入口校验。
# 不取号、不出包、不清理——本文件的 run_number 是独立序列，永不参与版本号
# （版本号只取出包工作流 android.yml 的 run_number）。出包与校验拆成两个
# 工作流文件，是因为 run_number 在运行创建时就按工作流分配，同一文件同时
# 接 push 与 pull_request 时 PR 运行照样吃号，步骤级 if 挡不住。

name: PR check

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7

    - name: set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Test and build (check only)
      shell: bash
      run: |
        set -o pipefail
        # 不传版本参数：gradle 回落 0.0.0.0.<buildNumber>，校验包不取发行号
        ./gradlew test assembleDebug 2>&1 | tee build.log

    - name: Verify R8 kept the Xposed entry class
      shell: bash
      run: |
        python3 - <<'PY'
        import glob, sys, zipfile
        apk = sorted(glob.glob('app/build/outputs/apk/debug/*.apk'))[0]
        with zipfile.ZipFile(apk) as z:
            dex = b''.join(z.read(n) for n in z.namelist()
                           if n.startswith('classes') and n.endswith('.dex'))
        ok = b'Lsumicya/fcmself/XposedMain;' in dex
        print(f'{apk}: 入口类 sumicya.fcmself.XposedMain '
              + ('已保留' if ok else '被 R8 改名或裁剪'))
        print(f'dex 合计 {len(dex)} 字节')
        sys.exit(0 if ok else 1)
        PY

    - name: Dump build log tail on failure
      if: failure()
      shell: bash
      run: |
        {
          echo '### Gradle build log (tail)'
          echo '```'
          tail -n 150 build.log
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
