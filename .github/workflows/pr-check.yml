name: PR check
on:
  pull_request:
permissions:
  contents: read
  actions: write
concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Test only
        run: ./gradlew test
  cleanup:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Cleanup (placeholder for five criteria)
        run: echo "cleanup job present; five criteria to be implemented"
