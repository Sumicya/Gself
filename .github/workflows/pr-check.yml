# Gself PR 校验：单测、编译与 R8 入口核对；不取号、不出包、不上传产物。
name: PR check

on:
  pull_request:

permissions:
  contents: read

env:
  SEGMENTS: '5'
  CLEANUP_APPLY: 'true'

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: 装 JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: 授予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 测试与构建（不取号）
        shell: bash
        run: |
          set -o pipefail
          ./gradlew test assembleDebug 2>&1 | tee build.log

      - name: 核对 R8 保留 Xposed 入口类
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, sys, zipfile
          apk = sorted(glob.glob('app/build/outputs/apk/debug/*.apk'))[0]
          with zipfile.ZipFile(apk) as z:
              dex = b''.join(z.read(n) for n in z.namelist()
                             if n.startswith('classes') and n.endswith('.dex'))
          ok = b'Lsumicya/fcmself/XposedMain;' in dex
          print(f'{apk}: 入口类 sumicya.fcmself.XposedMain '
                + ('已保留' if ok else '被 R8 改名或裁剪'))
          print(f'dex 合计 {len(dex)} 字节')
          sys.exit(0 if ok else 1)
          PY

  cleanup-artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: gself-cleanup
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: 按五条判据清理产物与运行记录
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          CLEANUP_SCOPE: actions
        run: python3 .github/scripts/cleanup.py
