# PR 校验工作流：跑测试、编译与 R8 入口校验，外加一个按五判据真删的清理
# job（会话推送即生效）。不取号、不出包——版本号只取 git 提交数，与本文件
# 的 run_number 无关。出包与校验拆成两个工作流文件，是因为同一文件同时接
# push 与 pull_request 时，同一提交会被各出一次包、同名产物互相覆盖。

name: PR check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7

    - name: set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Test and build (check only)
      shell: bash
      run: |
        set -o pipefail
        # 不传版本参数：gradle 回落 0.0.0.0.<buildNumber>，校验包不取发行号
        ./gradlew test assembleDebug 2>&1 | tee build.log

    - name: Verify R8 kept the Xposed entry class
      shell: bash
      run: |
        python3 - <<'PY'
        import glob, sys, zipfile
        apk = sorted(glob.glob('app/build/outputs/apk/debug/*.apk'))[0]
        with zipfile.ZipFile(apk) as z:
            dex = b''.join(z.read(n) for n in z.namelist()
                           if n.startswith('classes') and n.endswith('.dex'))
        ok = b'Lsumicya/fcmself/XposedMain;' in dex
        print(f'{apk}: 入口类 sumicya.fcmself.XposedMain '
              + ('已保留' if ok else '被 R8 改名或裁剪'))
        print(f'dex 合计 {len(dex)} 字节')
        sys.exit(0 if ok else 1)
        PY

    - name: Dump build log tail on failure
      if: failure()
      shell: bash
      run: |
        {
          echo '### Gradle build log (tail)'
          echo '```'
          tail -n 150 build.log
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    runs-on: ubuntu-24.04
    concurrency:
      group: gself-cleanup
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # 清理的号源核验要按 head sha 数提交，必须全量克隆。
          fetch-depth: 0
      - name: 按五条判据清理（真删）
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SELF: ${{ github.run_id }}
          SEGMENTS: '5'
          CLEANUP_APPLY: 'true'
        run: python3 .github/scripts/cleanup.py
