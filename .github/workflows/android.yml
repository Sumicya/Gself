# Android CI —— 「零 secrets」配置：仓库不需要任何签名密钥 / 发布 token。
# build job 只做三件事——跑单元测试、编译 debug 包、上传一个产物；清理由独立 job 完成：
#   - Gself-<版本>-debug.apk ：debug 签名，可直接安装测试
# 本地签名步骤见 docs/build-and-sign-termux.md。
#
# 要点：
#   1. 只出 debug 包（debug 也开 minify，入口类由 proguard-rules.pro 保住）
#   2. 先跑 ./gradlew test，介入判据（PushTest）不过就不继续构建
#   3. 校验 R8 没有裁掉入口类（裁掉了构建仍然成功，但模块会静默不加载）
#   4. 构建失败时把日志尾部写进 job summary
#   5. main 成功构建后只保留 Android CI 工作流最新 1 个 artifact；PR 不执行清理

name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7

    - name: set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Retrieve version name
      # 构建数 = github.run_number（第几次 CI 构建），versionCode 同源（见 build.gradle.kts）
      run: echo "VERSION_NAME=26.10.1.${{ github.run_number }}" >> $GITHUB_ENV

    - name: Build with Gradle
      shell: bash
      run: |
        set -o pipefail
        # test 放在最前：介入判据（PushTest）不通过就不必继续构建
        ./gradlew -Pfcmself.buildNumber="${{ github.run_number }}" test assembleDebug 2>&1 | tee build.log

    - name: Rename artifact
      shell: bash
      run: |
        cd ${{ github.workspace }}/app/build/outputs/apk
        mv debug/app-debug.apk debug/Gself-${{ env.VERSION_NAME }}-debug.apk

    - name: Verify R8 kept the Xposed entry class
      shell: bash
      run: |
        # LSPosed 按 META-INF/xposed/java_init.list 里的类名字符串加载入口类。
        # R8 若把它改名或裁剪，构建仍会成功，但模块会静默不加载——所以在 CI 里直接查 dex。
        python3 - <<'PY'
        import glob, sys, zipfile
        apk = sorted(glob.glob('app/build/outputs/apk/debug/*.apk'))[0]
        with zipfile.ZipFile(apk) as z:
            dex = b''.join(z.read(n) for n in z.namelist()
                           if n.startswith('classes') and n.endswith('.dex'))
        ok = b'Lsumicya/fcmself/XposedMain;' in dex
        print(f'{apk}: 入口类 sumicya.fcmself.XposedMain '
              + ('已保留' if ok else '被 R8 改名或裁剪'))
        print(f'dex 合计 {len(dex)} 字节')
        sys.exit(0 if ok else 1)
        PY

    - name: Upload apk
      uses: actions/upload-artifact@v7
      with:
        name: Gself-${{ env.VERSION_NAME }}
        path: ${{ github.workspace }}/app/build/outputs/apk/debug/Gself-${{ env.VERSION_NAME }}-debug.apk
        retention-days: 5

    - name: Dump build log tail on failure
      if: failure()
      shell: bash
      run: |
        {
          echo '### Gradle build log (tail)'
          echo '```'
          tail -n 150 build.log
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

  cleanup_artifacts:
    name: Clean old CI artifacts
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: gself-artifact-retention
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
    steps:
    - uses: actions/checkout@v7

    - name: Retain latest Android CI artifact
      env:
        GITHUB_TOKEN: ${{ github.token }}
        KEEP_ARTIFACT: "1"
      run: python3 .github/scripts/cleanup_artifacts.py
