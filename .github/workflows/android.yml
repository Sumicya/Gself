# Android CI —— 「零 secrets」配置：仓库不需要任何签名密钥 / 发布 token。
# CI 做四件事——跑单元测试、编译 debug 包、上传产物、按数量清理旧产物：
#   - Gself-<五段版本>.apk ：debug 签名，可直接安装测试
# 本地签名步骤见 docs/build-and-sign-termux.md。
#
# 版本口径（见 AGENTS.md「版本计数口径」，遵 GLOBAL.md 第二十五版修订统一五段）：
#   - 五段 = yy.m.d.当日序号.总序号，日界 UTC+8；来源为 android.yml 的真实运行记录，
#     锚定本次运行的 created_at / run_id / run_attempt，不取查询时的最新运行冒充本次。
#   - 当日序号 = 本次运行在当日全部已触发运行（含失败）中的位次（位次法，并发不抢号）。
#   - 总序号只数历史成功出包构建（衔接常数 22，见 AGENTS.md）；失败运行不增加总序号。
#   - run_attempt > 1 时复用首次 attempt 已定的版本，不重新加号。
#   - 版本数据缺失、取数失败或校验不通过，立即停止出包与上传。
# 清理：构建 job 在上传成功后立即保留最近 5 个 artifact（任意触发事件含 PR）。
#   按第二十五版修订，清理只授予最小 actions: write 删除本项目 artifact，禁止
#   contents: write；脚本写死只删归属核验通过（workflow 路径 + 运行记录）的对象，
#   删前打印保留 + 删除清单，失败只报错不回滚。已有积压当场清、不留待以后。

name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # 清理专用（第二十五版修订）：只删本项目 artifact 的最小 actions: write；
      # 禁止 contents: write。脚本写死只删归属核验通过的对象。
      actions: write
    steps:
    - uses: actions/checkout@v7

    - name: set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Compute five-segment version
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        # 输入 = 本次运行的 run_id / run_attempt / created_at（来自本 run 对象，不 list 取最新）。
        stamp="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.created_at')"
        attempt="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.run_attempt')"
        if [ -z "$stamp" ] || [ "$stamp" = "null" ]; then
          echo "::error::无法取得本次运行创建时间，按规范停止出包与上传" >&2
          exit 1
        fi
        # 重试：attempt > 1 直接复用首次 attempt 已定的版本（从本运行已有产物名取），不重新加号。
        if [ "$attempt" -gt 1 ]; then
          prev="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
                    --jq '[.artifacts[].name] | map(select(startswith("Gself-"))) | .[0] // empty')"
          if [ -n "$prev" ]; then
            v="${prev#Gself-}"
            if printf '%s' "$v" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "VERSION_NAME=$v" >> "$GITHUB_ENV"
              echo "VERSION_CODE=$(printf '%s' "$v" | cut -d. -f5)" >> "$GITHUB_ENV"
              echo "重试运行：复用首次 attempt 版本 $v"
              exit 0
            fi
          fi
        fi
        day="$(TZ=Asia/Shanghai date -d "$stamp" +%y.%-m.%-d)"
        local_day="$(TZ=Asia/Shanghai date -d "$stamp" +%Y-%m-%d)"
        since="$(TZ=Asia/Shanghai date -u -d "$local_day 00:00:00" +%Y-%m-%dT%H:%M:%SZ)"
        # 当日序号 = 本次运行在当日全部已触发运行（含失败）中的位次；按 id 升序排位，并发不抢号。
        today="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/android.yml/runs?created=>=$since&per_page=100" --jq '.workflow_runs[].id' \
                  | sort -n | grep -n "^$GITHUB_RUN_ID$" | cut -d: -f1 || true)"
        # 总序号 = 历史成功出包构建数 + 衔接常数 22（见 AGENTS.md，保证不回退）；失败运行不增加总序号。
        succ="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/android.yml/runs?status=success&per_page=1" --jq '.total_count')"
        for n in "$today" "$succ"; do
          case "$n" in
            ''|*[!0-9]*) echo "::error::序号取数失败（取值：'$n'），按规范停止出包与上传" >&2; exit 1 ;;
          esac
        done
        total=$((succ + 22))
        echo "VERSION_NAME=$day.$today.$total" >> "$GITHUB_ENV"
        echo "VERSION_CODE=$total" >> "$GITHUB_ENV"

    - name: Build with Gradle
      shell: bash
      run: |
        set -o pipefail
        # test 放在最前：介入判据（PushTest）不通过就不必继续构建
        ./gradlew -Pfcmself.buildNumber="${{ github.run_number }}" -PversionName="${{ env.VERSION_NAME }}" -PversionCode="${{ env.VERSION_CODE }}" test assembleDebug 2>&1 | tee build.log

    - name: Rename artifact
      shell: bash
      run: |
        cd ${{ github.workspace }}/app/build/outputs/apk
        mv debug/app-debug.apk debug/Gself-${{ env.VERSION_NAME }}.apk

    - name: Verify R8 kept the Xposed entry class
      shell: bash
      run: |
        # LSPosed 按 META-INF/xposed/java_init.list 里的类名字符串加载入口类。
        # R8 若把它改名或裁剪，构建仍会成功，但模块会静默不加载——所以在 CI 里直接查 dex。
        python3 - <<'PY'
        import glob, sys, zipfile
        apk = sorted(glob.glob('app/build/outputs/apk/debug/*.apk'))[0]
        with zipfile.ZipFile(apk) as z:
            dex = b''.join(z.read(n) for n in z.namelist()
                           if n.startswith('classes') and n.endswith('.dex'))
        ok = b'Lsumicya/fcmself/XposedMain;' in dex
        print(f'{apk}: 入口类 sumicya.fcmself.XposedMain '
              + ('已保留' if ok else '被 R8 改名或裁剪'))
        print(f'dex 合计 {len(dex)} 字节')
        sys.exit(0 if ok else 1)
        PY

    - name: Upload apk
      uses: actions/upload-artifact@v7
      with:
        name: Gself-${{ env.VERSION_NAME }}
        path: ${{ github.workspace }}/app/build/outputs/apk/debug/Gself-${{ env.VERSION_NAME }}.apk
        retention-days: 5
        if-no-files-found: error
        # 重试运行复用首次 attempt 的版本名，同名产物已存在时按规范覆盖为同版本同内容，
        # 而不是报「已存在」把重跑卡死；正常运行版本名唯一，此项不生效。
        overwrite: true

    - name: Cleanup old artifacts (keep newest 5)
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        keep=5
        echo "::notice::cleanup stage A: fetch artifacts"
        gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" > artifacts.json
        echo "::notice::cleanup stage B: fetched $(wc -c < artifacts.json) bytes"
        python3 - "$keep" <<'PY'
        import json, os, subprocess, sys, traceback
        def _hook(t, v, tb):
            for chunk in traceback.format_exception(t, v, tb):
                for line in chunk.splitlines():
                    print(f"::error::cleanup python: {line}")
        sys.excepthook = _hook
        keep = int(sys.argv[1])
        repo = os.environ["GITHUB_REPOSITORY"]
        arts, seen = [], set()
        raw = open("artifacts.json", encoding="utf-8").read()
        dec = json.JSONDecoder()
        idx, n = 0, len(raw)
        while idx < n:
            while idx < n and raw[idx] in " \r\n\t":
                idx += 1
            if idx >= n:
                break
            obj, idx = dec.raw_decode(raw, idx)
            for a in obj.get("artifacts", []):
                if a["id"] not in seen:
                    seen.add(a["id"])
                    arts.append(a)
        arts.sort(key=lambda a: a["created_at"], reverse=True)
        # 归属核验写死：名称前缀仅作初筛；必须能追到本仓 android.yml 的运行记录才算
        # 本项目对象。核验不过的对象不计入保留窗口、不删，只列出报告。
        runpath = {}
        def verify(a):
            wr = (a.get("workflow_run") or {}).get("id")
            if not wr:
                return False
            if wr not in runpath:
                r = subprocess.run(["gh", "api", f"repos/{repo}/actions/runs/{wr}",
                                    "--jq", ".path"], capture_output=True, text=True)
                runpath[wr] = r.stdout.strip() if r.returncode == 0 else ""
            return runpath[wr] == ".github/workflows/android.yml"
        print(f"::notice::cleanup stage C: parsed {len(arts)} artifacts")
        verified, unverified = [], []
        for a in arts:
            (verified if verify(a) else unverified).append(a)
        print(f"::notice::cleanup stage D: verified {len(verified)} unverified {len(unverified)}")
        keepers, victims = verified[:keep], verified[keep:]
        def runid(a):
            return (a.get("workflow_run") or {}).get("id") or "-"
        # 删除前打印完整保留清单 + 删除清单
        print(f"保留 {len(keepers)} 个：")
        for a in keepers:
            print(f"  {a['id']}  {a['name']}  {a['created_at']}  run={runid(a)}")
        print(f"删除 {len(victims)} 个：")
        for a in victims:
            print(f"  {a['id']}  {a['name']}  {a['created_at']}  run={runid(a)}")
        if unverified:
            print(f"归属核验未通过（不删、不计窗口）{len(unverified)} 个：")
            for a in unverified:
                print(f"  {a['id']}  {a['name']}  {a['created_at']}  run={runid(a)}")
        with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
            f.write(f"### Artifact 清理（保留最近 {keep} 个）\n\n")
            f.write("| 动作 | id | 名称 | 创建时间 | 来源运行 |\n| --- | --- | --- | --- | --- |\n")
            for a in keepers:
                f.write(f"| 保留 | {a['id']} | {a['name']} | {a['created_at']} | {runid(a)} |\n")
            for a in victims:
                f.write(f"| 删除 | {a['id']} | {a['name']} | {a['created_at']} | {runid(a)} |\n")
            for a in unverified:
                f.write(f"| 跳过(归属未核验) | {a['id']} | {a['name']} | {a['created_at']} | {runid(a)} |\n")
        print(f"::notice::cleanup 台账：保留 {len(keepers)} 删除 {len(victims)} 未核验 {len(unverified)}")
        # 失败只报错，不回滚新产物，不删保留窗口内对象
        errors = []
        for a in victims:
            r = subprocess.run(["gh", "api", "-X", "DELETE",
                                f"repos/{repo}/actions/artifacts/{a['id']}",
                               capture_output=True, text=True)
            if r.returncode != 0:
                print(f"::error::DELETE artifact {a['id']} ({a['name']}) 失败: {r.stderr.strip()}")
                errors.append(f"{a['id']} {a['name']}: {r.stderr.strip()}")
        if errors:
            raise SystemExit("清理删除失败（不声称达标）：\n" + "\n".join(errors))
        left = sum(1 for a in json.loads(subprocess.run(
            ["gh", "api", f"repos/{repo}/actions/artifacts?per_page=100"],
            capture_output=True, text=True, check=True).stdout)["artifacts"] if verify(a))
        if left > keep:
            raise SystemExit(f"清理后仍有 {left} 个已核验 artifact，超出上限 {keep}")
        print(f"清理完成，已核验 artifact 剩余 {left} 个")
        PY

    - name: Dump build log tail on failure
      if: failure()
      shell: bash
      run: |
        {
          echo '### Gradle build log (tail)'
          echo '```'
          tail -n 150 build.log
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

