# Android CI —— 「零 secrets」配置：仓库不需要任何签名密钥 / 发布 token。
# CI 做四件事——跑单元测试、编译 debug 包、上传产物、按数量清理旧产物：
#   - Gself-<五段版本>.apk ：debug 签名，可直接安装测试
# 本地签名步骤见 docs/build-and-sign-termux.md。
#
# 版本口径（见 AGENTS.md「版本计数口径」，遵 GLOBAL.md 统一五段（规范不带版本号））：
#   - 五段 = yy.m.d.当日序号.总序号，日界 UTC+8；来源为 android.yml 的真实运行记录，
#     锚定本次运行的 created_at / run_id / run_attempt，不取查询时的最新运行冒充本次。
#   - 当日序号 = 当日该仓出包运行（push / workflow_dispatch）的序号，按开始时间递增。
#   - 总序号 = 本次 run 的 run_number（原值，不查历史）；当日序号取不到退化四段。
#   - run_attempt > 1 时复用首次 attempt 已定的版本，不重新加号。
#   - 版本数据缺失、取数失败或校验不通过，立即停止出包与上传。
# 本文件是出包工作流，全仓唯一号源：只接 push（main）与 workflow_dispatch。
#   PR 校验在 pr-check.yml（独立 run_number 序列，永不参与版本号）；禁止一个
#   工作流同时接 push 与 pull_request——run_number 在运行创建时就分配，
#   步骤级 if 挡不住 PR 运行吃号（实测教训，见 CHANGELOG）。
# 清理：构建 job 在出包运行上传成功后立即保留最近 5 个 artifact。
#   清理只授予最小 actions: write 删除本项目 artifact 与 run，禁止
#   contents: write；脚本写死只删归属核验通过（workflow 路径 + 运行记录）的对象，
#   删前打印保留 + 删除清单，失败只报错不回滚。已有积压当场清、不留待以后。

name: Android CI

env:
  # 命名口径声明：产物版本段数。清理的口径判据按此删段数不符的产物。
  SEGMENTS: "5"

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # 清理专用：只删本项目 artifact 与 run 的最小 actions: write；
      # 禁止 contents: write。脚本写死只删归属核验通过的对象。
      actions: write
    steps:
    - uses: actions/checkout@v7

    - name: set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Compute five-segment version
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        # 输入 = 本次运行的 run_id / run_attempt / created_at（来自本 run 对象，不 list 取最新）。
        stamp="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.created_at')"
        attempt="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.run_attempt')"
        if [ -z "$stamp" ] || [ "$stamp" = "null" ]; then
          echo "::error::无法取得本次运行创建时间，按规范停止出包与上传" >&2
          exit 1
        fi
        # 重试：attempt > 1 直接复用首次 attempt 已定的版本（从本运行已有产物名取），不重新加号。
        if [ "$attempt" -gt 1 ]; then
          prev="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
                    --jq '[.artifacts[].name] | map(select(startswith("Gself-"))) | .[0] // empty')"
          if [ -n "$prev" ]; then
            v="${prev#Gself-}"
            if printf '%s' "$v" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "VERSION_NAME=$v" >> "$GITHUB_ENV"
              echo "VERSION_CODE=$(printf '%s' "$v" | cut -d. -f5)" >> "$GITHUB_ENV"
              echo "重试运行：复用首次 attempt 版本 $v"
              exit 0
            fi
          fi
        fi
        day="$(TZ=Asia/Shanghai date -d "$stamp" +%y.%-m.%-d)"
        local_day="$(TZ=Asia/Shanghai date -d "$stamp" +%Y-%m-%d)"
        since="$(TZ=Asia/Shanghai date -u -d "$local_day 00:00:00" +%Y-%m-%dT%H:%M:%SZ)"
        # 当日序号 = 当日该仓出包运行的序号：数当日 android.yml 的运行（本文件
        # 只接 push / workflow_dispatch），按 run_started_at 升序取本次位次。
        # 禁止按 head 提交位次取数（并发必然竞态）。
        today="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/android.yml/runs?created=>=$since&per_page=100" --jq '.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch") | [(.run_started_at // .created_at), .id] | @tsv' | sort -k1,1 -k2,2n | awk -F '\t' -v id="$GITHUB_RUN_ID" '$2 == id {print NR; exit}')"
        # 总序号 = 本次 run 的 run_number（取自运行上下文，不查历史；本仓未记录
        # 基线，用原值）。旧锚（历史成功数、现存 artifact 最大号）停用。
        total=${GITHUB_RUN_NUMBER}
        case "$total" in
          ''|*[!0-9]*|0) echo "::error::总序号取数失败（run_number：'$total'），按规范停止出包与上传" >&2; exit 1 ;;
        esac
        # 当日序号取不到 → 按规范退化四段 yy.m.d.总序号，并写明退化原因。
        case "$today" in
          ''|*[!0-9]*|0)
            echo "::warning::当日序号取不到（commits 查询结果：'$today'），退化四段版本 $day.$total"
            echo "VERSION_NAME=$day.$total" >> "$GITHUB_ENV"
            echo "VERSION_CODE=$total" >> "$GITHUB_ENV"
            exit 0 ;;
        esac
        echo "VERSION_NAME=$day.$today.$total" >> "$GITHUB_ENV"
        echo "VERSION_CODE=$total" >> "$GITHUB_ENV"

    - name: Build with Gradle
      shell: bash
      run: |
        set -o pipefail
        # test 放在最前：介入判据（PushTest）不通过就不必继续构建
        ./gradlew -Pfcmself.buildNumber="${{ github.run_number }}" -PversionName="${{ env.VERSION_NAME }}" -PversionCode="${{ env.VERSION_CODE }}" test assembleDebug 2>&1 | tee build.log

    - name: Rename artifact
      shell: bash
      run: |
        cd ${{ github.workspace }}/app/build/outputs/apk
        mv debug/app-debug.apk debug/Gself-${{ env.VERSION_NAME }}.apk

    - name: Verify R8 kept the Xposed entry class
      shell: bash
      run: |
        # LSPosed 按 META-INF/xposed/java_init.list 里的类名字符串加载入口类。
        # R8 若把它改名或裁剪，构建仍会成功，但模块会静默不加载——所以在 CI 里直接查 dex。
        python3 - <<'PY'
        import glob, sys, zipfile
        apk = sorted(glob.glob('app/build/outputs/apk/debug/*.apk'))[0]
        with zipfile.ZipFile(apk) as z:
            dex = b''.join(z.read(n) for n in z.namelist()
                           if n.startswith('classes') and n.endswith('.dex'))
        ok = b'Lsumicya/fcmself/XposedMain;' in dex
        print(f'{apk}: 入口类 sumicya.fcmself.XposedMain '
              + ('已保留' if ok else '被 R8 改名或裁剪'))
        print(f'dex 合计 {len(dex)} 字节')
        sys.exit(0 if ok else 1)
        PY

    - name: Upload apk
      uses: actions/upload-artifact@v7
      with:
        name: Gself-${{ env.VERSION_NAME }}
        path: ${{ github.workspace }}/app/build/outputs/apk/debug/Gself-${{ env.VERSION_NAME }}.apk
        retention-days: 5
        if-no-files-found: error
        # 重试运行复用首次 attempt 的版本名，同名产物已存在时按规范覆盖为同版本同内容，
        # 而不是报「已存在」把重跑卡死；正常运行版本名唯一，此项不生效。
        overwrite: true

    - name: Cleanup (three criteria, keep newest 5 per sequence)
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        keep=5
        gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" > artifacts.json
        gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" > runs.json
        python3 - "$keep" <<'PY'
        import json, os, subprocess, sys, datetime
        from collections import defaultdict
        keep = int(sys.argv[1])
        SEGMENTS = int(os.environ.get("SEGMENTS", "5"))
        repo = os.environ["GITHUB_REPOSITORY"]
        tz8 = datetime.timezone(datetime.timedelta(hours=8))
        today8 = datetime.datetime.now(tz8).date()
        def d8(iso):
            return datetime.datetime.fromisoformat(iso.replace("Z", "+00:00")).astimezone(tz8).date()
        def parse_pages(fname, key):
            items, seen = [], set()
            raw = open(fname, encoding="utf-8").read()
            dec = json.JSONDecoder()
            idx, n = 0, len(raw)
            while idx < n:
                while idx < n and raw[idx] in " \r\n\t":
                    idx += 1
                if idx >= n:
                    break
                obj, idx = dec.raw_decode(raw, idx)
                for it in obj.get(key, []):
                    if it["id"] not in seen:
                        seen.add(it["id"])
                        items.append(it)
            return items
        # ---------- artifact：三判据 ----------
        # 判据一口径：段数 != 工作流顶部 SEGMENTS 声明值 → 删（不豁免当日）。
        # 判据二来源：workflow_run 事件为 pull_request → 删（不豁免当日）。
        # 判据三数量：当日之外、每条工作流序列保留最近 keep 个；当日不删。
        arts = parse_pages("artifacts.json", "artifacts")
        arts.sort(key=lambda a: a["created_at"], reverse=True)
        _ri = {}
        def runinfo(a):
            wr = (a.get("workflow_run") or {}).get("id")
            if not wr:
                return ("", "")
            if wr not in _ri:
                r = subprocess.run(["gh", "api", f"repos/{repo}/actions/runs/{wr}",
                                    "--jq", "[.path, .event] | @tsv"],
                                   capture_output=True, text=True)
                parts = r.stdout.strip().split("\t") if r.returncode == 0 else []
                _ri[wr] = (parts[0], parts[1]) if len(parts) == 2 else ("", "")
            return _ri[wr]
        ALLOWED = (".github/workflows/android.yml", ".github/workflows/build.yml")
        verified, unverified = [], []
        for a in arts:
            (verified if runinfo(a)[0] in ALLOWED else unverified).append(a)
        victims, candidates = [], []
        for a in verified:
            path, event = runinfo(a)
            ver = a["name"][len("Gself-"):] if a["name"].startswith("Gself-") else ""
            seg = ver.count(".") + 1 if ver else 0
            if seg != SEGMENTS:
                victims.append((a, f"口径 {seg} 段 != SEGMENTS {SEGMENTS}"))
            elif event == "pull_request":
                victims.append((a, "来源 pull_request 运行"))
            else:
                candidates.append(a)
        groups = defaultdict(list)
        for a in candidates:
            groups[runinfo(a)[0]].append(a)
        keepers = []
        for path, lst in groups.items():
            for i, a in enumerate(lst):
                if i >= keep and d8(a["created_at"]) != today8:
                    victims.append((a, f"数量 超出 {path} 序列 {keep}"))
                else:
                    keepers.append(a)
        def runid(a):
            return (a.get("workflow_run") or {}).get("id") or "-"
        print(f"保留 {len(keepers)} 个：")
        for a in keepers:
            print(f"  {a['id']}  {a['name']}  {a['created_at']}  run={runid(a)}")
        print(f"删除 {len(victims)} 个：")
        for a, why in victims:
            print(f"  {a['id']}  {a['name']}  {a['created_at']}  run={runid(a)}  [{why}]")
        if unverified:
            print(f"归属核验未通过（不删、不计窗口）{len(unverified)} 个：")
            for a in unverified:
                print(f"  {a['id']}  {a['name']}  {a['created_at']}  run={runid(a)}")
        with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
            f.write("### Artifact 清理（三判据）\n\n")
            f.write("| 动作 | id | 名称 | 创建时间 | 来源运行 | 判据 |\n| --- | --- | --- | --- | --- | --- |\n")
            for a in keepers:
                f.write(f"| 保留 | {a['id']} | {a['name']} | {a['created_at']} | {runid(a)} | - |\n")
            for a, why in victims:
                f.write(f"| 删除 | {a['id']} | {a['name']} | {a['created_at']} | {runid(a)} | {why} |\n")
            for a in unverified:
                f.write(f"| 跳过(归属未核验) | {a['id']} | {a['name']} | {a['created_at']} | {runid(a)} | - |\n")
        print(f"::notice::cleanup artifacts：保留 {len(keepers)} 删除 {len(victims)} 未核验 {len(unverified)}")
        errors = []
        for a, why in victims:
            r = subprocess.run(["gh", "api", "-X", "DELETE",
                                f"repos/{repo}/actions/artifacts/{a['id']}"],
                               capture_output=True, text=True)
            if r.returncode != 0:
                print(f"::error::DELETE artifact {a['id']} ({a['name']}) 失败: {r.stderr.strip()}")
                errors.append(str(a["id"]))
        if errors:
            raise SystemExit(f"artifact 清理失败（不声称达标）：{','.join(errors)}")
        print("artifact 清理完成")
        # ---------- runs：数量判据（按工作流序列，当日不删） ----------
        # 清理只挂出包工作流：PR 校验等其它工作流的超量 run 在这里一并删。
        runs = parse_pages("runs.json", "workflow_runs")
        cur = int(os.environ["GITHUB_RUN_ID"])
        rgroups = defaultdict(list)
        for r0 in runs:
            rgroups[r0["name"]].append(r0)
        rkeepers, rvictims, rskipped = [], [], []
        for name, lst in rgroups.items():
            lst.sort(key=lambda r0: r0["created_at"], reverse=True)
            for i, r0 in enumerate(lst):
                if i < keep:
                    rkeepers.append(r0)
                elif r0["id"] == cur or r0.get("status") != "completed" or d8(r0["created_at"]) == today8:
                    rskipped.append(r0)
                else:
                    rvictims.append(r0)
        print(f"运行记录保留 {len(rkeepers)} 条：")
        for r0 in rkeepers:
            print(f"  {r0['id']}  {r0['name']}  {r0['created_at']}  {r0.get('conclusion')}")
        print(f"运行记录删除 {len(rvictims)} 条：")
        for r0 in rvictims:
            print(f"  {r0['id']}  {r0['name']}  {r0['created_at']}  {r0.get('conclusion')}")
        print(f"::notice::cleanup runs：保留 {len(rkeepers)} 删除 {len(rvictims)} 跳过(未完/当前/今日) {len(rskipped)}")
        rerrors = []
        for r0 in rvictims:
            rr = subprocess.run(["gh", "api", "-X", "DELETE",
                                 f"repos/{repo}/actions/runs/{r0['id']}"],
                                capture_output=True, text=True)
            if rr.returncode != 0:
                print(f"::error::DELETE run {r0['id']} 失败: {rr.stderr.strip()}")
                rerrors.append(str(r0["id"]))
        if rerrors:
            raise SystemExit(f"运行记录清理失败（不声称达标）：{','.join(rerrors)}")
        print(f"运行记录清理完成，删除 {len(rvictims)} 条")
        PY

    - name: Dump build log tail on failure
      if: failure()
      shell: bash
      run: |
        {
          echo '### Gradle build log (tail)'
          echo '```'
          tail -n 150 build.log
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

