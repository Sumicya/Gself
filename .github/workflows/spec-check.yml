# 只读规范检查：不写任何东西，不使用任何 secrets，只做静态核对。
# 检查范围（对应 Sumicya/selfs GLOBAL.md 第十七版）：
#   1. AGENTS.md 存在，且带规范指针（Sumicya/selfs）与「上次同步 = 第 N 版」版本戳
#   2. AGENTS.md 仍写有发版禁令、滚动保留授权与只读写权限的常驻规则
#   3. 版本单一来源：构建配置只读 -PversionName / -PversionCode，工作流一处算定
#   4. 禁止自动发版：工作流与 .github/scripts 里没有创建 Release / tag 的实现
#   5. 权限最小化：只允许 android.yml 的清理 job 拿 actions: write，其余写权限一律不允许
#   6. 滚动保留策略落地：KEEP_ARTIFACT 是正整数，artifact 有 retention-days 兜底
# 这是静态检查，不是发版授权；本工作流自身只有 contents: read。

name: spec-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  spec-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check global specification
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path(".")
          failures: list[str] = []

          def require(ok: bool, message: str) -> None:
              if not ok:
                  failures.append(message)

          # 1) AGENTS.md：规范指针 + 版本戳
          # 本检查执行的规范版本；与 AGENTS.md 的版本戳必须一致——升版时两处一起改，
          # 只改一处就会被这里拦住（避免「AGENTS.md 说第十七版、检查还按第十五版跑」）。
          spec_version = "第十七版"
          agents_path = root / "AGENTS.md"
          require(agents_path.exists(), "缺少 AGENTS.md")
          agents = agents_path.read_text(encoding="utf-8") if agents_path.exists() else ""
          require("Sumicya/selfs" in agents, "AGENTS.md 缺少指向 Sumicya/selfs 的规范指针")
          require("GLOBAL.md" in agents, "AGENTS.md 缺少 GLOBAL.md 指针")
          stamp = re.search(r"上次同步\s*=\s*第\s*[0-9一二三四五六七八九十百千]+\s*版", agents)
          require(stamp is not None, "AGENTS.md 缺少「上次同步 = 第 N 版」版本戳")
          if stamp is not None:
              stamp_text = re.sub(r"\s+", "", stamp.group(0))
              require(
                  stamp_text.endswith(f"={spec_version}"),
                  f"AGENTS.md 版本戳（{stamp.group(0)}）与本检查执行的规范版本 {spec_version} 不一致",
              )

          # 2) 常驻规则条目仍在
          for item in [
              "任何本轮本地改动必须最终提交并推送",
              "CI 不得自动创建 Release",
              "Release 1 个",
              "Actions artifact 5 个",
              "只读规范检查",
              "滚动清理",
          ]:
              require(item in agents, f"AGENTS.md 缺少全局规范条目：{item}")

          # 3) 版本单一来源：构建配置只读属性，发行版本由工作流一处算定
          gradle = (root / "app" / "build.gradle.kts").read_text(encoding="utf-8")
          require('gradleProperty("versionName")' in gradle, "app/build.gradle.kts 未从 -PversionName 读取版本名")
          require('gradleProperty("versionCode")' in gradle, "app/build.gradle.kts 未从 -PversionCode 读取版本号")
          require(not re.search(r'"\d+\.\d+\.\d+\.\d+', gradle), "app/build.gradle.kts 里写死了四段发行版本")

          # 3b) 只做新包与不做降级：只实现 Android 16 起的广播出口，不双写旧出口；
          #     不支持的环境在安装时明确拒绝（minSdk），文档不假装支持
          fixes_path = root / "app" / "src" / "main" / "kotlin" / "sumicya" / "fcmself" / "Fixes.kt"
          require(fixes_path.exists(), "缺少 Fixes.kt")
          fixes = fixes_path.read_text(encoding="utf-8") if fixes_path.exists() else ""
          require("minSdk = 36" in gradle, "minSdk 应为 36（只做新包：旧版本安装时明确拒绝）")
          require('classOf(CONTROLLER)' in fixes, "推送唤醒未直接挂 BroadcastController（新机制）")
          require("ActivityManagerService" not in fixes, "Fixes.kt 仍保留旧广播出口（AMS），违反只做新包")
          readme = (root / "README.md").read_text(encoding="utf-8")
          require("Android 16+" in readme, "README 未写明 Android 16+ 要求（不支持的环境要说明，不假装支持）")
          android = (root / ".github" / "workflows" / "android.yml").read_text(encoding="utf-8")
          require('"VERSION_NAME=' in android and '"VERSION_CODE=' in android, "android.yml 未一处算定并导出 VERSION_NAME / VERSION_CODE")
          require("github.run_number" in android, "android.yml 的总序号未使用 github.run_number")

          # 4) 禁止自动发版：工作流与脚本里不得出现创建 Release / tag 的实现
          forbidden = re.compile(
              r"(?i)("
              r"softprops/action-gh-release|actions/create-release|"
              r"gh release create|gh release upload|gh release edit|gh release delete|"
              r"createRelease|create_git_release|createDraftRelease|"
              r"git tag\s|git push[^\n]*--tags|git push[^\n]*--follow-tags"
              r")"
          )
          workflows = sorted((root / ".github" / "workflows").glob("*.yml"))
          scripts = sorted((root / ".github" / "scripts").glob("*.py")) if (root / ".github" / "scripts").exists() else []
          for path in workflows + scripts:
              if path.name == "spec-check.yml":
                  continue
              text = path.read_text(encoding="utf-8")
              match = forbidden.search(text)
              require(match is None, f"{path} 含自动发版实现（{match.group(0) if match else ''}）；第十七版规范禁止 CI 自动发版")

          # 5) 权限最小化：只有 android.yml 的清理 job 可以拿 actions: write
          write_permission = re.compile(
              r"^\s{2,}(contents|actions|pull-requests|id-token|packages|deployments|security-events|statuses)\s*:\s*write\s*$",
              re.MULTILINE,
          )
          for path in workflows:
              source = path.read_text(encoding="utf-8")
              found = {match.group(1) for match in write_permission.finditer(source)}
              allowed = {"actions"} if path.name == "android.yml" else set()
              unexpected = found - allowed
              require(not unexpected, f"{path} 出现不该有的写权限：{sorted(unexpected)}")

          # 6) 滚动保留策略落地
          require("KEEP_ARTIFACT" in android, "android.yml 缺少 artifact 保留数（KEEP_ARTIFACT）")
          keep = re.search(r'KEEP_ARTIFACT:\s*"(\d+)"', android)
          require(keep is not None and int(keep.group(1)) >= 1, "KEEP_ARTIFACT 必须是正整数")
          require(re.search(r"retention-days:\s*[1-9]\d*", android) is not None, "upload-artifact 缺少 retention-days 时间兜底")
          # 保留对象只算发行产物：非发行构建（Gself-dev-*）不占名额，否则会把发行包挤出窗口
          cleanup_path = root / ".github" / "scripts" / "cleanup_artifacts.py"
          require(cleanup_path.exists(), "缺少 .github/scripts/cleanup_artifacts.py")
          cleanup = cleanup_path.read_text(encoding="utf-8") if cleanup_path.exists() else ""
          require("Gself-dev-" in cleanup, "清理脚本未声明非发行构建（Gself-dev-*）不占保留名额")
          require("NON_RELEASE" in cleanup, "清理脚本缺少非发行构建的判定常量")
          require(re.search(r"NON_RELEASE_NAME\.match", cleanup) is not None, "清理脚本未把非发行构建排除在保留窗口之外")
          require("Gself-dev-" in agents and "不占保留名额" in agents, "AGENTS.md 未写明非发行构建不占保留名额")

          if failures:
              for item in failures:
                  print(f"::error::{item}")
              raise SystemExit(f"规范检查未通过（{len(failures)} 项）")
          print("第十七版规范检查通过")
