# Gself 出包：push（改动产物面）与手动触发都出 debug APK，产物名 Gself-<五段版本>，留 5 天。
# 号源是 github.run_number 原值；清理在独立 job，构建红了也照跑。
name: build

on:
  push:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  SEGMENTS: '5'
  CLEANUP_APPLY: 'true'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: gself-build
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: 装 JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: 授予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 扫残留死码与零用导入
        run: python3 tools/deadcode.py

      - name: 算版本 yy.m.d.当日号.总序号
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
        run: python3 tools/version.py

      - name: 测试与构建
        shell: bash
        run: |
          set -o pipefail
          if ! ./gradlew -PversionName="${{ env.VERSION_NAME }}" -PversionCode="${{ env.VERSION_CODE }}" test assembleDebug 2>&1 | tee build.log; then
            echo "::error::构建失败；build.log 末尾：$(tail -8 build.log 2>/dev/null | tr '\n' ' ' | head -c 800)"
            exit 1
          fi
          mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/Gself-${{ env.VERSION_NAME }}.apk"

      - name: 核 APK（入口类／原生库／许可／图标／体积）
        run: python3 tools/apkcheck.py

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: Gself-${{ env.VERSION_NAME }}
          path: ${{ github.workspace }}/app/build/outputs/apk/debug/Gself-${{ env.VERSION_NAME }}.apk
          retention-days: 5
          if-no-files-found: error
          overwrite: true

  cleanup-artifacts:
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: gself-build
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: 按五条判据清理产物与运行记录
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: python3 tools/cleanup.py
