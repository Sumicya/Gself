# Gself 出包：push（不限分支）与手动触发出 debug APK；PR 校验在 pr-check.yml。
# 号源只取 github.run_number 原值，当日序号差值锚定；清理在独立 job，构建红了也照跑。
name: Build

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'bad/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  SEGMENTS: '5'
  CLEANUP_APPLY: 'true'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7

      - name: 装 JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: 授予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 算版本 yy.m.d.当日序号.总序号
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          # GitHub 的 Actions 接口会抖（2026-10-30 18:00 UTC+8 前后连续两次取号步 502 直接红掉整轮），
          # 取号只读两个接口，重试不改变结果，却能把这种平台抖动挡在构建之外。
          fetch() {
            for i in 1 2 3 4 5; do
              if gh api "$1" > "$2"; then return 0; fi
              echo "取号接口 $1 第 $i 次失败，3 秒后重试" >&2
              sleep 3
            done
            echo "取号接口 $1 连续 5 次失败" >&2
            return 1
          }
          fetch "repos/$REPO/actions/workflows/build.yml/runs?per_page=100" runs.json
          fetch "repos/$REPO/actions/artifacts?per_page=100" arts.json
          python3 - <<'PY'
          import json, os, re, sys
          from datetime import datetime, timedelta, timezone

          TZ = timezone(timedelta(hours=8))
          repo = os.environ["REPO"]
          run_number = int(os.environ["RUN_NUMBER"])
          runs = json.load(open("runs.json"))["workflow_runs"]
          arts = json.load(open("arts.json"))["artifacts"]

          def local_day(stamp: str) -> str:
              return datetime.fromisoformat(stamp.replace("Z", "+00:00")).astimezone(TZ).strftime("%y.%-m.%-d")

          today = local_day(datetime.now(TZ).isoformat())
          todays = [r["run_number"] for r in runs if local_day(r["run_started_at"]) == today]
          first = min(todays) if todays else run_number

          # 当日现存合规产物 Gself-yy.m.d.d0.r0 反推当日首条运行号 r0 - d0 + 1
          pat = re.compile(r"^" + re.escape(repo.split("/")[-1]) + r"-(\d{2}\.\d{1,2}\.\d{1,2})\.(\d+)\.(\d+)$")
          for a in arts:
              m = pat.match(a["name"])
              if not m or a.get("expired") or m.group(1) != today:
                  continue
              first = min(first, int(m.group(3)) - int(m.group(2)) + 1)

          daily = run_number - first + 1
          if daily < 1:
              sys.exit(f"当日序号小于 1：run_number={run_number} R_first={first}")
          version = f"{today}.{daily}.{run_number}"
          if not re.fullmatch(r"\d{2}\.\d{1,2}\.\d{1,2}\.\d+\.\d+", version):
              sys.exit(f"版本不是五段：{version}")
          print(f"取号：HEAD SHA={os.environ.get('GITHUB_SHA', '')} run_id={os.environ['RUN_ID']} "
                f"run_number={run_number} R_first={first} 当日序号={daily} 版本={version}")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"VERSION_NAME={version}\nVERSION_CODE={run_number}\n")
          PY
          rm -f runs.json arts.json

      - name: 测试与构建
        shell: bash
        run: |
          set -o pipefail
          ./gradlew -Pfcmself.buildNumber="${{ env.VERSION_CODE }}" -PversionName="${{ env.VERSION_NAME }}" -PversionCode="${{ env.VERSION_CODE }}" test assembleDebug 2>&1 | tee build.log

      - name: 改产物名
        shell: bash
        run: |
          cd ${{ github.workspace }}/app/build/outputs/apk
          mv debug/app-debug.apk debug/Gself-${{ env.VERSION_NAME }}.apk

      - name: 打印产物体积构成并校验体积预算
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, sys, zipfile

          BUDGET = 360_000  # 体积预算：超出说明有白装打进来了，先看构成再决定，不默默放过
          apk = sorted(glob.glob('app/build/outputs/apk/debug/*.apk'))[0]
          with zipfile.ZipFile(apk) as z:
              infos = z.infolist()
              entries = {i.filename: len(z.read(i.filename)) for i in infos}
              classes = sum(v for k, v in entries.items() if k.startswith('classes') and k.endswith('.dex'))
          total_c = sum(i.compress_size for i in infos)
          total_u = sum(i.file_size for i in infos)
          print(f'{apk}: 压缩后 {total_c} 字节 / 解压 {total_u} 字节，{len(infos)} 个条目')
          print(f'dex 合计 {classes} 字节；ABI 目录 '
                f'{sorted({n.split("/")[1] for n in entries if n.startswith("lib/")})}')
          print('压缩后字节    解压字节  条目')
          for i in sorted(infos, key=lambda x: x.compress_size, reverse=True)[:15]:
              print(f'{i.compress_size:>10}{i.file_size:>12}  {i.filename}')
          if total_c > BUDGET:
              print(f'产物体积 {total_c} 字节超出预算 {BUDGET} 字节')
              sys.exit(1)
          print(f'体积预算 {BUDGET} 字节，余量 {BUDGET - total_c} 字节')
          PY

      - name: 核对 R8 保留 Xposed 入口类
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, sys, zipfile
          apk = sorted(glob.glob('app/build/outputs/apk/debug/*.apk'))[0]
          with zipfile.ZipFile(apk) as z:
              dex = b''.join(z.read(n) for n in z.namelist()
                             if n.startswith('classes') and n.endswith('.dex'))
          ok = b'Lsumicya/fcmself/XposedMain;' in dex
          print(f'{apk}: 入口类 sumicya.fcmself.XposedMain '
                + ('已保留' if ok else '被 R8 改名或裁剪'))
          print(f'dex 合计 {len(dex)} 字节')
          sys.exit(0 if ok else 1)
          PY

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: Gself-${{ env.VERSION_NAME }}
          path: ${{ github.workspace }}/app/build/outputs/apk/debug/Gself-${{ env.VERSION_NAME }}.apk
          retention-days: 5
          if-no-files-found: error
          overwrite: true

  cleanup-artifacts:
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: gself-cleanup
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: 按五条判据清理产物与运行记录
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          CLEANUP_SCOPE: actions
        run: python3 .github/scripts/cleanup.py

  cleanup-releases:
    needs: build
    if: always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: gself-cleanup
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Release 只留最近 1 个，孤立 tag 一并删
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          CLEANUP_SCOPE: releases
        run: python3 .github/scripts/cleanup.py
