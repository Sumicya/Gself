# Build —— 「零 secrets」：单元测试、debug 包、上传产物；出包后自动清（保留 5 个发行对象）。
# 不创建 Release / tag / Release asset。

name: Build

on:
  push:
  pull_request:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7

    - name: set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Compute release version
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        release=false
        if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then release=true; fi
        fi
        if [ "$release" = "true" ]; then
          stamp="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.created_at')"
          day="$(TZ=Asia/Shanghai date -d "$stamp" +%y.%-m.%-d)"
          local_day="$(TZ=Asia/Shanghai date -d "$stamp" +%Y-%m-%d)"
          since="$(date -u -d "${local_day}T00:00:00+08:00" +%Y-%m-%dT%H:%M:%SZ)"
          today="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?created=>=$since&per_page=100" \
            --jq '.workflow_runs[] | select((.event == "push" or .event == "workflow_dispatch") and .head_branch == "main") | .run_number' \
            | awk -v n="$GITHUB_RUN_NUMBER" '$1 <= n' | wc -l)"
          name="$day.$today.$GITHUB_RUN_NUMBER"
        else
          name="dev-$GITHUB_RUN_NUMBER"
        fi
        echo "VERSION_NAME=$name" >> "$GITHUB_ENV"
        echo "VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
        {
          echo "### 本次版本"
          echo
          echo "- versionName: \`$name\`"
          echo "- versionCode: \`$GITHUB_RUN_NUMBER\`"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Build with Gradle
      shell: bash
      run: |
        set -o pipefail
        ./gradlew -PversionName="${{ env.VERSION_NAME }}" -PversionCode="${{ env.VERSION_CODE }}" test assembleDebug 2>&1 | tee build.log

    - name: Rename artifact
      shell: bash
      run: |
        cd ${{ github.workspace }}/app/build/outputs/apk
        mv debug/app-debug.apk debug/Gself-${{ env.VERSION_NAME }}.apk

    - name: Verify R8 kept the Xposed entry class
      shell: bash
      run: |
        python3 - <<'PY'
        import glob, sys, zipfile
        apk = sorted(glob.glob('app/build/outputs/apk/debug/*.apk'))[0]
        with zipfile.ZipFile(apk) as z:
            dex = b''.join(z.read(n) for n in z.namelist()
                           if n.startswith('classes') and n.endswith('.dex'))
        ok = b'Lsumicya/fcmself/XposedMain;' in dex
        print(f'{apk}: 入口类 sumicya.fcmself.XposedMain '
              + ('已保留' if ok else '被 R8 改名或裁剪'))
        print(f'dex 合计 {len(dex)} 字节')
        sys.exit(0 if ok else 1)
        PY

    - name: Upload apk
      uses: actions/upload-artifact@v7
      with:
        name: Gself-${{ env.VERSION_NAME }}
        path: ${{ github.workspace }}/app/build/outputs/apk/debug/Gself-${{ env.VERSION_NAME }}.apk
        retention-days: 5

    - name: Dump build log tail on failure
      if: failure()
      shell: bash
      run: |
        {
          echo '### Gradle build log (tail)'
          echo '```'
          tail -n 150 build.log
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

  cleanup_artifacts:
    name: 清理旧 Actions artifact
    if: ${{ github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: gself-artifact-retention
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
    steps:
    - uses: actions/checkout@v7

    - name: 只保留最近 5 个 artifact
      env:
        GITHUB_TOKEN: ${{ github.token }}
        KEEP_ARTIFACT: "5"
      run: python3 .github/scripts/cleanup_artifacts.py
