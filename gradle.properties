# 构建数：本地构建的默认值；CI 用 -Pfcmself.buildNumber=${{ github.run_number }} 覆盖，
# 所以 CI 产物的 versionCode = 第几次 CI 构建。versionName = 26.10.1.<构建数>。
fcmself.buildNumber=1

org.gradle.jvmargs=-Xmx2048m
# 并行 / 缓存 / 配置缓存（AGP 9 全部支持，缩短 CI 与本地构建时间）
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
