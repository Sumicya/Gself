# 发行版本（五段 yy.m.d.当日序号.总序号）由 CI 以 build.yml 的 run_number 一处算定，
# 经 -PversionName / -PversionCode 传入，构建配置只读，不在这里写死日期或序号。
# 本地构建不传参数时是非发行版本（versionName 带 dev- 前缀、versionCode=1）；
# 要接着 CI 的总序号走就传 -PversionCode=<最近一次 CI 产物的第五段>。
org.gradle.jvmargs=-Xmx2048m
# 并行 / 缓存 / 配置缓存（AGP 9 全部支持，缩短 CI 与本地构建时间）
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
