# 发行版本（五段 yy.m.d.当日序号.总序号）由 Android CI 一处算定，构建配置只读
# -PversionName / -PversionCode，不在这里写死日期或序号。
# 本地构建不传参数时是非发行版本 dev-1，versionCode=1；要接着 CI 的序号走就传：
#   ./gradlew -PversionCode=<CI 最近一次 run 号> assembleDebug
# 查 CI 最近一次 run 号的查法见 AGENTS.md。
org.gradle.jvmargs=-Xmx2048m
# 并行 / 缓存 / 配置缓存（AGP 9 全部支持，缩短 CI 与本地构建时间）
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
